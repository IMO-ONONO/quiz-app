<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%">
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">交通手段別通勤者数</text>
  <text x="200" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">（500人調査・単位：人）</text>

  <!-- Y軸グリッドラインとラベル -->
  <g font-family="sans-serif" font-size="11" fill="#777">
    <!-- y=220 → 0, y=184 → 50, y=148 → 100, y=112 → 150, y=76 → 200, y=40 → 250 -->
    <line x1="50" y1="220" x2="390" y2="220" stroke="#ccc" stroke-width="1"/>
    <text x="44" y="224" text-anchor="end">0</text>
    <line x1="50" y1="184" x2="390" y2="184" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="188" text-anchor="end">50</text>
    <line x1="50" y1="148" x2="390" y2="148" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="152" text-anchor="end">100</text>
    <line x1="50" y1="112" x2="390" y2="112" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="116" text-anchor="end">150</text>
    <line x1="50" y1="76" x2="390" y2="76" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="80" text-anchor="end">200</text>
    <line x1="50" y1="40" x2="390" y2="40" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="44" text-anchor="end">250</text>
  </g>

  <!-- Y軸本線 -->
  <line x1="50" y1="40" x2="50" y2="220" stroke="#999" stroke-width="1.5"/>

  <!-- 棒グラフ（各棒: bar_width=42, spacing=67, base_x=50） -->
  <!-- 鉄道 200: top y=76, height=144 -->
  <rect x="62" y="76" width="42" height="144" fill="#ef5350" stroke="#e53935" stroke-width="1"/>
  <text x="83" y="71" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">200</text>
  <text x="83" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">鉄道</text>

  <!-- 自動車 160: top y=105, height=115 -->
  <rect x="129" y="105" width="42" height="115" fill="#ab47bc" stroke="#9c27b0" stroke-width="1"/>
  <text x="150" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">160</text>
  <text x="150" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">自動車</text>

  <!-- バス 80: top y=162, height=58 -->
  <rect x="196" y="162" width="42" height="58" fill="#42a5f5" stroke="#2196f3" stroke-width="1"/>
  <text x="217" y="157" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">80</text>
  <text x="217" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">バス</text>

  <!-- 自転車 35: top y=195, height=25 -->
  <rect x="263" y="195" width="42" height="25" fill="#26a69a" stroke="#00897b" stroke-width="1"/>
  <text x="284" y="190" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">35</text>
  <text x="284" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">自転車</text>

  <!-- 徒歩 25: top y=202, height=18 -->
  <rect x="330" y="202" width="42" height="18" fill="#ff7043" stroke="#f4511e" stroke-width="1"/>
  <text x="351" y="197" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">25</text>
  <text x="351" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">徒歩</text>
</svg>
