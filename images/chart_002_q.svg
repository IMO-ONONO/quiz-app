<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%">
  <text x="200" y="22" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">部門別売上高</text>
  <text x="200" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">（単位：百万円）</text>

  <!-- Y軸グリッドラインとラベル -->
  <g font-family="sans-serif" font-size="11" fill="#777">
    <!-- y=220 → 0, y=184 → 100, y=148 → 200, y=112 → 300, y=76 → 400, y=40 → 500 -->
    <line x1="50" y1="220" x2="390" y2="220" stroke="#ccc" stroke-width="1"/>
    <text x="44" y="224" text-anchor="end">0</text>
    <line x1="50" y1="184" x2="390" y2="184" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="188" text-anchor="end">100</text>
    <line x1="50" y1="148" x2="390" y2="148" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="152" text-anchor="end">200</text>
    <line x1="50" y1="112" x2="390" y2="112" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="116" text-anchor="end">300</text>
    <line x1="50" y1="76" x2="390" y2="76" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="80" text-anchor="end">400</text>
    <line x1="50" y1="40" x2="390" y2="40" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="44" y="44" text-anchor="end">500</text>
  </g>

  <!-- Y軸本線 -->
  <line x1="50" y1="40" x2="50" y2="220" stroke="#999" stroke-width="1.5"/>

  <!-- 棒グラフ（各棒: bar_width=42, spacing=67, base_x=50） -->
  <!-- 営業部 450: top y=58, height=162 -->
  <rect x="62" y="58" width="42" height="162" fill="#64b5f6" stroke="#42a5f5" stroke-width="1"/>
  <text x="83" y="53" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">450</text>
  <text x="83" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">営業部</text>

  <!-- 開発部 320: top y=105, height=115 -->
  <rect x="129" y="105" width="42" height="115" fill="#81c784" stroke="#66bb6a" stroke-width="1"/>
  <text x="150" y="100" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">320</text>
  <text x="150" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">開発部</text>

  <!-- 総務部 130: top y=173, height=47 -->
  <rect x="196" y="173" width="42" height="47" fill="#ffb74d" stroke="#ffa726" stroke-width="1"/>
  <text x="217" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">130</text>
  <text x="217" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">総務部</text>

  <!-- 製造部 380: top y=83, height=137 -->
  <rect x="263" y="83" width="42" height="137" fill="#f06292" stroke="#ec407a" stroke-width="1"/>
  <text x="284" y="78" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">380</text>
  <text x="284" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">製造部</text>

  <!-- 企画部 220: top y=141, height=79 -->
  <rect x="330" y="141" width="42" height="79" fill="#ba68c8" stroke="#ab47bc" stroke-width="1"/>
  <text x="351" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">220</text>
  <text x="351" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">企画部</text>
</svg>
