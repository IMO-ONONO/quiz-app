<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイクイズ</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
</head>
<body>
  <main class="screen">
    <h1>マイクイズ</h1>
    <p class="subtitle">分野を選んで10問解こう</p>
    <p class="stats" id="stats" hidden></p>

    <div class="menu">
      <button class="menu-button" data-subject="animals" type="button">
        <span class="menu-label">動物の生態</span>
      </button>
      <button class="menu-button" data-subject="paleontology" type="button">
        <span class="menu-label">古生物</span>
      </button>
      <button class="menu-button" data-subject="cs" type="button">
        <span class="menu-label">コンピュータサイエンス</span>
      </button>
      <button class="menu-button" data-subject="art" type="button">
        <span class="menu-label">美術</span>
      </button>
      <button class="menu-button review-button" id="review-button" type="button">
        <span class="menu-label">間違えた問題を見直す</span>
        <span class="unresolved-count" id="count-review"></span>
      </button>
      <button class="menu-button" id="stats-button" type="button" onclick="window.location.href='stats.html'">
        <span class="menu-label">成績確認</span>
      </button>
    </div>
  </main>
  <script src="js/main.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
